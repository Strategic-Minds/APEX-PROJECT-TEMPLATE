name: Drive Sync

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  sync:
    name: Sync Project State to Google Drive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run State Sync
        env:
          GOOGLEDRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLEDRIVE_ACCESS_TOKEN }}
        run: |
          if [ -z "$GOOGLEDRIVE_ACCESS_TOKEN" ]; then
            echo "::warning::GOOGLEDRIVE_ACCESS_TOKEN secret is missing. Skipping synchronization to Google Drive."
            exit 0
          fi
          echo "GOOGLEDRIVE_ACCESS_TOKEN is available. Executing sync script..."
          python3 scripts/sync-state.py
